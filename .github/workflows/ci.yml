name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Validate tool registry
        run: npm run validate:registry

      - name: Verify every executable tool contract
        run: npm run test:tools

      - name: Production build
        run: npm run build

  browser-smoke:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

  deploy:
    name: Verify Vercel production deployment
    needs: [quality, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: read
    steps:
      - name: Wait for Vercel's deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployments="repos/$GITHUB_REPOSITORY/deployments"
          for attempt in {1..48}; do
            id=$(gh api --method GET "$deployments" -f sha="$GITHUB_SHA" -f environment=Production \
              --jq '[.[] | select(.creator.login == "vercel[bot]")][0].id // empty')
            if [[ -n "$id" ]]; then
              status=$(gh api "$deployments/$id/statuses" \
                --jq '[.[] | select(.creator.login == "vercel[bot]")][0].state // "pending"')
              echo "Vercel deployment $id for $GITHUB_SHA: $status"
              case "$status" in
                success) exit 0 ;;
                error|failure|inactive) exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Vercel to confirm this production deployment."
          exit 1
